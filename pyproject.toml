[build-system]
requires = ["setuptools>=60.0", "wheel", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cypyc"
version = "0.1.0"
description = "Cypy compiler - A Python-like language that compiles to Cython"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Cypy Team", email = "dev@cypy.dev" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
keywords = ["compiler", "cython", "transpiler"]

dependencies = [
    "Cython>=3.0.0",
    "setuptools>=60.0",
    "watchdog>=3.0.0",
]

[project.scripts]
cypyc = "cypyc.cli:main"
cypy-hook = "cypy_hook.hook:main"



[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "*.pyc", "*.pyo", "*.pyd", ".eggs", "*.egg-info", "build", "dist", ".tox", ".venv"]

[tool.mypy]
python_version = "3.9"
strict = true
show_error_codes = true
exclude = [
    "tests/",
    "examples/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
