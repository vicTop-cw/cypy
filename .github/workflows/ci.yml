name: Cypy CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install Cython pytest pytest-cov

    - name: Run lint
      run: |
        flake8 cypyc/ --max-line-length=100 --exclude=__pycache__
        flake8 cypy_hook/ --max-line-length=100 --exclude=__pycache__

    - name: Run type check
      run: |
        mypy cypyc/ --ignore-missing-imports || true

    - name: Run tests
      run: |
        python -m pytest tests/ -x -q --tb=short

    - name: Run comprehensive test suite
      run: |
        python -m pytest tests/ -q --tb=short

    - name: Run benchmark
      run: |
        python -m pytest tests/benchmark/ -q --tb=short || true

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install Cython pytest

    - name: Run tests
      run: |
        python -m pytest tests/ -x -q --tb=short
